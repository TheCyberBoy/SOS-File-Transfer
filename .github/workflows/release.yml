name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:all

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug --console=plain

      - name: Package artifacts
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p artifacts
          # The hostable site: unzip onto any static host, or open over a local
          # server. Registers a service worker, so it runs offline after one visit.
          (cd dist && zip -qr "../artifacts/sos-file-transfer-$TAG-site.zip" .)
          # The two self-contained pages: no server, no network, no install.
          cp dist-standalone/sos-file-transfer-sender.html "artifacts/sos-file-transfer-$TAG-sender.html"
          cp dist-standalone/sos-file-transfer-receiver.html "artifacts/sos-file-transfer-$TAG-receiver.html"
          # Debug-keystore-signed, installs straight from a phone with no
          # extra setup — same build android.yml already verifies on every
          # push, just carried through to a proper release asset name
          # instead of a generic Gradle "app-debug.apk".
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/SOS-File-Transfer-$TAG.apk"
          (cd artifacts && sha256sum ./* > SHA256SUMS.txt)
          ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
